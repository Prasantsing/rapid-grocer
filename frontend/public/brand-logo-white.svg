<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Emerald Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00e599" stop-opacity="0.02" />
    </linearGradient>
    
    <!-- Soft Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#047857" flood-opacity="0.22" />
    </filter>
    <filter id="zapGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f5a0" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Clean Container Card with Subtle Emerald Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bgGrad)" stroke="#00e599" stroke-width="6" stroke-opacity="0.35" />

  <g transform="translate(18, 14) scale(0.93)" filter="url(#softShadow)">
    <!-- Basket Handles (Warm Copper Gradient) -->
    <path d="M 205 180 C 205 95, 307 95, 307 180" 
          fill="none" 
          stroke="url(#copperGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          opacity="0.8" />
    <path d="M 175 180 C 175 65, 337 65, 337 180" 
          fill="none" 
          stroke="url(#copperGrad)" 
          stroke-width="17" 
          stroke-linecap="round" />

    <!-- Basket Top Rim -->
    <rect x="75" y="180" width="362" height="26" rx="13" fill="url(#emeraldGrad)" />

    <!-- Basket Body Shell (Woven Contour) -->
    <path d="M 98 206 
             L 128 385 
             C 133 415, 155 432, 185 432 
             L 327 432 
             C 357 432, 379 415, 384 385 
             L 414 206 Z" 
          fill="url(#glowGrad)" 
          stroke="url(#emeraldGrad)" 
          stroke-width="16" 
          stroke-linejoin="round" />

    <!-- Minimalist Woven Ribs -->
    <path d="M 152 206 L 175 425" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 212 206 L 224 428" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 272 206 L 272 428" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 332 206 L 320 428" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 360 206 L 338 330" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />

    <!-- Horizontal Weave Bands -->
    <path d="M 112 260 Q 256 285 400 260" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9" />
    <path d="M 122 335 Q 256 360 340 340" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9" />

    <!-- Dynamic Speed Lightning Bolt (Zap Delivery) -->
    <g filter="url(#zapGlow)">
      <polygon points="350,155 265,295 325,295 240,455 445,275 365,275"
               fill="url(#zapGrad)" 
               stroke="#ffffff" 
               stroke-width="7" 
               stroke-linejoin="round" />
      <polygon points="348,175 285,285 328,285 280,395 405,285 355,285"
               fill="#ffffff" 
               opacity="0.55" />
    </g>
  </g>
</svg>

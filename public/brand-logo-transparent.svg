<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Emerald Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00e599" stop-opacity="0" />
    </linearGradient>
    
    <!-- Soft Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.25" />
    </filter>
    <filter id="zapGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f5a0" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Basket Handles (Warm Copper Gradient) -->
    <!-- Back Handle -->
    <path d="M 205 190 C 205 105, 307 105, 307 190" 
          fill="none" 
          stroke="url(#copperGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          opacity="0.8" />
    <!-- Front Handle with 3D Angle -->
    <path d="M 175 190 C 175 75, 337 75, 337 190" 
          fill="none" 
          stroke="url(#copperGrad)" 
          stroke-width="17" 
          stroke-linecap="round" />

    <!-- Basket Top Rim -->
    <rect x="75" y="190" width="362" height="26" rx="13" fill="url(#emeraldGrad)" />

    <!-- Basket Body Shell (Woven Contour) -->
    <path d="M 98 216 
             L 128 395 
             C 133 425, 155 442, 185 442 
             L 327 442 
             C 357 442, 379 425, 384 395 
             L 414 216 Z" 
          fill="url(#glowGrad)" 
          stroke="url(#emeraldGrad)" 
          stroke-width="16" 
          stroke-linejoin="round" />

    <!-- Sleek Minimalist Woven Ribs -->
    <path d="M 152 216 L 175 435" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 212 216 L 224 438" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 272 216 L 272 438" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 332 216 L 320 438" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <path d="M 360 216 L 338 340" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" />

    <!-- Horizontal Weave Bands -->
    <path d="M 112 270 Q 256 295 400 270" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9" />
    <path d="M 122 345 Q 256 370 340 350" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9" />

    <!-- Dynamic Speed Lightning Bolt (Zap Delivery) -->
    <g filter="url(#zapGlow)">
      <polygon points="350,165 265,305 325,305 240,465 445,285 365,285"
               fill="url(#zapGrad)" 
               stroke="#ffffff" 
               stroke-width="7" 
               stroke-linejoin="round" />
      <!-- High-gloss inner core -->
      <polygon points="348,185 285,295 328,295 280,405 405,295 355,295"
               fill="#ffffff" 
               opacity="0.55" />
    </g>
  </g>
</svg>
